server:
  port: ${PORT:8080}

spring:
  application:
    name: order-management-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
  level:
    com.challenge.orders: INFO
