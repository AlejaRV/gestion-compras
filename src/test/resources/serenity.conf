webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["--headless", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu", "--window-size=1920,1080"]
    }
  }
}

serenity {
  take.screenshots = AFTER_EACH_STEP
  project.name = "Order Management API - Serenity BDD E2E"
}
