name: CI/CD Quality Pipeline - Order Management API

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Quality Gates & Acceptance Testing
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del Código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔨 Compilar Proyecto
        run: mvn clean compile -B

      - name: 🧪 Ejecutar Pruebas Unitarias y Cobertura JaCoCo
        run: mvn test -DskipITs -B

      - name: 📊 Quality Gate: Verificar Cobertura JaCoCo (Líneas y Ramas >= 80%)
        run: mvn jacoco:check -B

      - name: 🧬 Quality Gate: Mutation Testing con PITest (Score >= 70%)
        run: mvn pitest:mutationCoverage -DskipITs -B

      - name: 🥒 Ejecutar Pruebas de Aceptación con Karate Framework
        run: mvn test -Dtest=OrdersAcceptanceIT -B

      - name: 📦 Construir Imagen Docker
        run: |
          docker build -t challenge-api:latest .
          docker images

      - name: 📤 Publicar Reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

      - name: 📤 Publicar Reporte PITest (Mutation Testing)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest-mutation-report
          path: target/pit-reports/

      - name: 📤 Publicar Reporte Karate Framework
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-acceptance-report
          path: target/karate-reports/
