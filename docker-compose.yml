version: '3.8'

services:
  order-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: challenge-api:latest
    container_name: order-management-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
